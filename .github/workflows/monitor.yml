name: "[운영] 국회 법률안 자동모니터링"

on:
  schedule:
    - cron: '30 21 * * *'  # 06:30 KST
    - cron: '0 22 * * *'   # 07:00 KST
    - cron: '30 22 * * *'  # 07:30 KST
    - cron: '0 23 * * *'   # 08:00 KST
  workflow_dispatch:
    inputs:
      force_send_recent:
        description: '최근 7일 매칭 건을 테스트 메일/허브로 강제 발송'
        required: false
        default: false
        type: boolean
      force_send_status_test:
        description: '추적 의안의 현재 진행상태를 테스트 메일/허브로 강제 발송'
        required: false
        default: false
        type: boolean

concurrency:
  group: assembly-law-monitor-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: macos-latest

    steps:
      - name: Log trigger timing
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_cron=${{ github.event.schedule }}"
          echo "started_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          TZ=Asia/Seoul date '+started_kst=%Y-%m-%d %H:%M:%S %Z'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run new bill monitor
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HUB_WEB_APP_URL: ${{ secrets.HUB_WEB_APP_URL }}
          FORCE_SEND_RECENT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send_recent || false }}
        run: python run_with_network_retry.py telegram_enriched_runner.py

      - name: Discover legacy bills with new late-stage events
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python run_with_network_retry.py late_stage_discovery.py

      - name: Run status change monitor
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HUB_WEB_APP_URL: ${{ secrets.HUB_WEB_APP_URL }}
          FORCE_SEND_STATUS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send_status_test || false }}
        run: python run_with_network_retry.py telegram_status_runner.py

      - name: Run promulgation and enforcement monitor
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HUB_WEB_APP_URL: ${{ secrets.HUB_WEB_APP_URL }}
        run: python hub_law_effective_runner.py

      - name: Commit updated state
        run: |
          if [ -z "$(git status --porcelain -- seen_bills.json late_stage_discovery_state.json)" ]; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seen_bills.json
          if [ -f late_stage_discovery_state.json ]; then
            git add -- late_stage_discovery_state.json
          fi
          git commit -m "Update law monitoring state"
          git push
