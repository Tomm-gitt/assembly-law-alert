name: National Assembly Law Monitor

on:
  schedule:
    # 06:30 KST = 21:30 UTC (previous day)
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      force_send_recent:
        description: '최근 7일 매칭 건을 테스트 메일로 강제 발송'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_SEND_RECENT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send_recent || false }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          if git diff --quiet -- seen_bills.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seen_bills.json
          git commit -m "Update seen bills state"
          git push
