name: Backfill HUB Assembly Metadata Once

on:
  push:
    branches:
      - main
    paths:
      - 'backfill_hub_metadata_once.py'
      - '.github/workflows/backfill-hub-metadata-once.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Resolve Assembly bill number and proposer metadata
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python backfill_hub_metadata_once.py
