name: "[감사] 2026 지정 6개 법률 전수 API 검증"

on:
  push:
    branches:
      - 'audit/2026-six-laws-census'
    paths:
      - 'audit_2026_six_laws.py'
      - '.github/workflows/audit-2026-six-laws.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 2026 six-law census
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python audit_2026_six_laws.py

      - name: Upload census result
        uses: actions/upload-artifact@v4
        with:
          name: audit-2026-six-laws
          path: |
            audit_2026_six_laws.json
            audit_2026_six_laws.csv
          if-no-files-found: error
