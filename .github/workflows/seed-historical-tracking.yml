name: "[운영] Historical O 추적 baseline 시드"
on:
  push:
    branches: [main]
    paths:
      - 'historical_tracking_seed_20261021.json'
      - 'seed_historical_tracking.py'
      - '.github/workflows/seed-historical-tracking.yml'
permissions:
  contents: write
concurrency:
  group: assembly-law-monitor-production
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Initialize historical O lifecycle without notifications
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python seed_historical_tracking.py
      - name: Commit tracking baseline
        run: |
          if git diff --quiet -- seen_bills.json; then
            echo "No seen_bills changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_bills.json
          git commit -m "Seed historical O bill lifecycle tracking"
          git pull --rebase origin main
          git push origin HEAD:main
