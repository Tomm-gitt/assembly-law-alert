name: "[테스트] 대안반영폐기 후속대안 자동탐색"

on:
  workflow_dispatch:
    inputs:
      original_bill_no:
        description: '대안반영폐기 원의안번호'
        required: true
        default: '2210213'
        type: string

jobs:
  dry-run-official-evidence:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-discover official successor without changing state
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          TEST_ORIGINAL_BILL_NO: ${{ inputs.original_bill_no }}
        run: python official_successor_evidence_runner.py

      - name: Prove production state unchanged
        run: git diff --exit-code -- seen_bills.json
