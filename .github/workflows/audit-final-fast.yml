name: "[감사] 2026 지정 6개 법률 최종표 FAST"

on:
  push:
    branches:
      - audit/2026-six-laws-census
    paths:
      - 'audit_final_fast.py'
      - '.github/workflows/audit-final-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build final table
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python audit_final_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-final-fast-2026-six-laws
          path: |
            audit_final_fast_2026_six_laws.csv
            audit_final_fast_2026_six_laws.json
