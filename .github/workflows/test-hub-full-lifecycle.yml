name: "[테스트] 허브 전체 lifecycle"

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'register=발의 등록 / continue=O 판정 후 전체 단계 진행'
        required: true
        default: 'register'
        type: choice
        options:
          - register
          - continue
      case_id:
        description: '같은 테스트 케이스에서 register/continue에 동일하게 입력'
        required: true
        default: '20260831E'
        type: string

jobs:
  hub-full-lifecycle:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full hub lifecycle test
        env:
          HUB_WEB_APP_URL: ${{ secrets.HUB_WEB_APP_URL }}
          TEST_PHASE: ${{ inputs.phase }}
          TEST_CASE_ID: ${{ inputs.case_id }}
        run: python test_hub_full_lifecycle.py
