name: Deploy HUB Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/hub/**'
  workflow_dispatch:
    inputs:
      deploy_webapp:
        description: 'Also update the existing Web App deployment'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-hub:
    runs-on: ubuntu-latest
    env:
      HUB_APPS_SCRIPT_ID: ${{ secrets.HUB_APPS_SCRIPT_ID }}
      WEB_APP_DEPLOYMENT_ID: ${{ secrets.WEB_APP_DEPLOYMENT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HUB_APPS_SCRIPT_ID" || { echo "Missing secret: HUB_APPS_SCRIPT_ID"; exit 1; }
          test -n "$CLASPRC_JSON" || { echo "Missing secret: CLASPRC_JSON"; exit 1; }
          test -f apps-script/hub/appsscript.json || { echo "apps-script/hub/appsscript.json is missing. Run 'Sync HUB Apps Script source' first."; exit 1; }
          gs_count=$(find apps-script/hub -maxdepth 1 -type f -name '*.gs' | wc -l | tr -d ' ')
          test "$gs_count" -ge 5 || { echo "HUB source looks incomplete: only $gs_count .gs files. Run source sync first."; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${{ inputs.deploy_webapp }}" = "true" ]; then
            test -n "$WEB_APP_DEPLOYMENT_ID" || { echo "Missing secret: WEB_APP_DEPLOYMENT_ID"; exit 1; }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"apps-script/hub"}\n' "$HUB_APPS_SCRIPT_ID" > .clasp.json

      - name: Show files to be pushed
        run: clasp status

      - name: Push GitHub source to Apps Script
        run: clasp push --force

      - name: Update existing Web App deployment
        if: ${{ github.event_name == 'push' || inputs.deploy_webapp }}
        shell: bash
        run: |
          set -euo pipefail
          desc="GitHub Actions ${GITHUB_SHA::7} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          clasp deploy --deploymentId "$WEB_APP_DEPLOYMENT_ID" --description "$desc"
