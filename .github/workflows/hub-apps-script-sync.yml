name: Sync HUB Apps Script source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-hub-source:
    runs-on: ubuntu-latest
    env:
      HUB_APPS_SCRIPT_ID: ${{ secrets.HUB_APPS_SCRIPT_ID }}
      HUB_CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HUB_APPS_SCRIPT_ID" || { echo "Missing secret: HUB_APPS_SCRIPT_ID"; exit 1; }
          test -n "$HUB_CLASPRC_JSON" || { echo "Missing secret: HUB_CLASPRC_JSON"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp authentication
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HUB_CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Pull live Apps Script project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hub-apps-script
          mkdir -p /tmp/hub-apps-script
          cd /tmp/hub-apps-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$HUB_APPS_SCRIPT_ID" > .clasp.json
          clasp pull

      - name: Mirror live source into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps-script/hub
          find apps-script/hub -mindepth 1 -maxdepth 1 -type f -delete
          find /tmp/hub-apps-script -mindepth 1 -maxdepth 1 -type f \
            ! -name '.clasp.json' \
            ! -name '.clasprc.json' \
            -exec cp {} apps-script/hub/ \;
          echo "Synced files:"
          find apps-script/hub -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Commit source snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/hub
          if git diff --cached --quiet; then
            echo "No Apps Script source changes detected."
            exit 0
          fi
          git commit -m "Sync HUB Apps Script source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
