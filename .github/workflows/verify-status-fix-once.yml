name: Verify status monitor fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-status-fix-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_lifecycle_delivery
      - name: Run status monitor
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          HUB_WEB_APP_URL: ${{ secrets.HUB_WEB_APP_URL }}
        run: python telegram_status_runner.py
      - name: Persist state
        run: |
          if [ -z "$(git status --porcelain -- seen_bills.json)" ]; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_bills.json
          git commit -m "Persist status monitor fix state"
          git push
