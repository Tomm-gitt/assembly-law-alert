name: "[테스트] LIKMS 대안승계 회귀검증"

on:
  pull_request:
    paths:
      - 'likms_successor.py'
      - 'successor_resolution.py'
      - 'successor_state.py'
      - 'successor_operations.py'
      - 'successor_state_test.py'
      - 'status_alert_runner.py'
      - 'alternative_successor.py'
      - 'likms_successor_regression_test.py'
      - '.github/workflows/test-likms-successor-regression.yml'
  workflow_dispatch:
    inputs:
      original_bill_no:
        description: '대안반영폐기 원의안번호 (예: 2203012)'
        required: true
        default: '2203012'
        type: string

jobs:
  regression:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production successor modules
        run: python -m py_compile likms_successor.py successor_resolution.py successor_state.py successor_operations.py status_alert_runner.py alternative_successor.py

      - name: Verify successor state safety rules
        run: python successor_state_test.py

      - name: Verify official successor relationship
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          TEST_ORIGINAL_BILL_NO: ${{ inputs.original_bill_no }}
        run: python likms_successor_regression_test.py

      - name: Prove production state unchanged
        run: git diff --exit-code -- seen_bills.json
